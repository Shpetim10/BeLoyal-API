# GENERAL CONFIGURATION
spring.application.name=BeLoyal

# DATABASE CONFIGURATION
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/besahub_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=true

# Setting up email server
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:digimenu10@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Base URL (single definition) — override in production via APP_BASE_URL env var
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Activation url
app.activation.base-url=${app.base-url}/activate

# Staff accept invitation url
app.staff.accept-invitation.base-url=${app.base-url}/accept-invitation

# Spring Security — rotate and set via env vars in production
app.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR}
app.jwt.access-ttl-minutes=15
app.refresh-ttl-days=30

# Separate secret for ownership tokens — rotate and set via env var in production
app.ownership.jwt.secret=${OWNERSHIP_JWT_SECRET:CHANGE_ME_OWNERSHIP_USE_ENV_VAR}

# Minutes until ownership token expires
app.ownership.jwt.ttl-minutes=15

# Minutes until reset password token expires
app.password.token.ttl-minutes=60
app.password.forget-email.base-url=${app.base-url}/reset-password

# CORS — comma-separated list of extra allowed origins (e.g. a Cloudflare tunnel URL)
app.cors.extra-origins=${CORS_EXTRA_ORIGINS:}

# This can matter for redirects, link building, and sometimes CORS expectations.
server.forward-headers-strategy=framework

# Server config
server.address=0.0.0.0
server.port=8080

# Local storage
app.storage.local.root=uploads
# Should be changed when using cloudflare tunnel
app.storage.public-base-url=${app.base-url}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=dev
spring.liquibase.show-summary=summary
spring.liquibase.show-summary-output=log

# REDIS CONFIGURATION
spring.data.redis.host=localhost
spring.data.redis.port=6379

# For production
spring.data.redis.password=
spring.data.redis.database=0

# Actuator - hide internals from unauthenticated callers
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

# Demo data seeding
# Enable only when you want a large, relationship-safe demo dataset for frontend work.
app.seed.demo.enabled=false
app.seed.demo.business-count=30
app.seed.demo.customer-count=64
